openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
security:
  - SessionCookie: []
tags:
  - name: health
    description: Health operations
  - name: procurement
    description: Procurement requests, supplier offers, approvals, invoices, and recommendations
paths:
  /tools/capabilities:
    get:
      operationId: getToolsCapabilities
      tags: [tools]
      responses:
        "200":
          description: Current account capability and safe setup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ToolsCapabilities" }
        "401": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
  /tools/secrets:
    get:
      operationId: listToolsSecrets
      tags: [tools]
      responses:
        "200":
          description: Metadata only, never stored values
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecretMetadata" }
        "401": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
    post:
      operationId: createToolsSecret
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretInput" }
      responses:
        "201":
          description: Created, metadata only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretMetadata" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
  /tools/secrets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$", maxLength: 64 }
    put:
      operationId: replaceToolsSecret
      tags: [tools]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretReplacement" }
      responses:
        "200":
          description: Replaced, metadata only
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretMetadata" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
    delete:
      operationId: deleteToolsSecret
      tags: [tools]
      responses:
        "204": { description: Deleted }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "404": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRegistration" }
      responses:
        "201":
          description: Account created and session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountUser" }
        "400": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "409": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountCredentials" }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountUser" }
        "400": { $ref: "#/components/responses/AuthError" }
        "401": { $ref: "#/components/responses/AuthError" }
        "403": { $ref: "#/components/responses/AuthError" }
        "429": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      responses:
        "200":
          description: Current signed-in account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountUser" }
        "401": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      responses:
        "204": { description: Session invalidated }
        "403": { $ref: "#/components/responses/AuthError" }
        "503": { $ref: "#/components/responses/AuthError" }
  /healthz:
    get:
      security: []
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /procurement/dashboard:
    get:
      operationId: getProcurementDashboard
      tags: [procurement]
      summary: Get procurement dashboard summary and recent activity
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementDashboard"
  /procurement/requests:
    get:
      operationId: listProcurementRequests
      tags: [procurement]
      summary: List procurement requests
      responses:
        "200":
          description: Procurement requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementRequestSummary"
    post:
      operationId: createProcurementRequest
      tags: [procurement]
      summary: Create a procurement request and generate supplier offers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementRequestInput"
      responses:
        "201":
          description: Created request with ranked offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementRequestDetail"
  /procurement/requests/{requestId}:
    get:
      operationId: getProcurementRequest
      tags: [procurement]
      summary: Get a procurement request and its supplier offers
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementRequestDetail"
        "404":
          description: Request not found
  /procurement/requests/{requestId}/decision:
    post:
      operationId: decideProcurementRequest
      tags: [procurement]
      summary: Approve or reject a supplier offer
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcurementDecisionInput"
      responses:
        "200":
          description: Updated request, with an invoice when approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementRequestDetail"
        "400":
          description: Invalid decision
        "404":
          description: Request or offer not found
  /procurement/invoices:
    get:
      operationId: listProcurementInvoices
      tags: [procurement]
      summary: List signed electronic invoice records
      responses:
        "200":
          description: Invoice records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcurementInvoice"
  /procurement/invoices/{invoiceId}/signature:
    post:
      operationId: signProcurementInvoice
      tags: [procurement]
      summary: Record a consenting account's typed electronic signature
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSignatureInput" }
      responses:
        "200":
          description: Persisted signed invoice
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcurementInvoice" }
        "400": { description: Invalid name or missing consent }
        "401": { description: Sign in required }
        "404": { description: Invoice not found }
        "409": { description: Invoice already signed }
  /procurement/invoices/{invoiceId}/supplier-signature:
    post:
      operationId: signSupplierProcurementInvoice
      tags: [procurement]
      summary: Record an unverified supplier representative signature through a workspace account
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvoiceSignatureInput" }
      responses:
        "200":
          description: Invoice with immutable supplier entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProcurementInvoice" }
        "400": { description: Invalid trimmed name or missing explicit authority and intent consent }
        "401": { description: Sign in required }
        "404": { description: Invoice not found }
        "409": { description: Supplier entry already recorded }
  /procurement/recommendations:
    get:
      operationId: getProcurementRecommendations
      tags: [procurement]
      summary: Generate recommendations from historical approval choices
      responses:
        "200":
          description: AI-generated recommendations grounded in approval history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcurementRecommendations"
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: procureflow_session
  responses:
    AuthError:
      description: Safe account or session error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/AccountError" }
  schemas:
    ToolsCapabilities:
      type: object
      required: [canManageSecrets, setupRequired]
      properties:
        canManageSecrets: { type: boolean }
        setupRequired: { type: boolean }
    SecretMetadata:
      type: object
      required: [name, configured, createdAt, updatedAt]
      properties:
        name: { type: string }
        configured: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    SecretInput:
      type: object
      additionalProperties: false
      required: [name, key]
      properties:
        name: { type: string, pattern: "^[A-Z][A-Z0-9_]{0,63}$", minLength: 1, maxLength: 64 }
        key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    SecretReplacement:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
    AccountUser:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    AccountCredentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    AccountRegistration:
      type: object
      required: [name, email, password, passwordConfirmation]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 128 }
        passwordConfirmation: { type: string, minLength: 12, maxLength: 128 }
    AccountError:
      type: object
      required: [error]
      properties:
        error: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ProcurementRequestInput:
      type: object
      required: [itemName, quantity, budgetAmount, currency, requiredDeliveryDate, deliveryLocation, requesterName]
      properties:
        itemName:
          type: string
          minLength: 2
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000000
        budgetAmount:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000000000
        currency:
          type: string
          minLength: 3
          maxLength: 3
        requiredDeliveryDate:
          type: string
          format: date
        deliveryLocation:
          type: string
          minLength: 2
        requesterName:
          type: string
          minLength: 2
    ProcurementOffer:
      type: object
      required: [id, supplierName, supplierLocation, distanceKm, unitPrice, shippingFee, totalPrice, currency, deliveryDays, reliability, overallScore, priceScore, speedScore, proximityScore, reliabilityScore, rank]
      properties:
        id: { type: integer }
        supplierName: { type: string }
        supplierLocation: { type: string }
        distanceKm: { type: number }
        unitPrice: { type: number }
        shippingFee: { type: number }
        totalPrice: { type: number }
        currency: { type: string }
        deliveryDays: { type: integer }
        reliability: { type: number }
        overallScore: { type: number }
        priceScore: { type: number }
        speedScore: { type: number }
        proximityScore: { type: number }
        reliabilityScore: { type: number }
        rank: { type: integer }
    InvoiceSignatureInput:
      type: object
      required: [typedName, consent]
      properties:
        typedName: { type: string, minLength: 2, maxLength: 120 }
        consent: { type: boolean, enum: [true] }
    InvoiceElectronicSignature:
      type: object
      required: [typedName, accountId, accountName, signedAt, consentVersion, documentHash]
      properties:
        typedName: { type: string }
        accountId: { type: integer }
        accountName: { type: string }
        signedAt: { type: string, format: date-time }
        consentVersion: { type: string }
        documentHash: { type: string }
    InvoiceSupplierSignature:
      type: object
      description: Internal entry by a workspace account; supplier identity and authority are not verified
      required: [typedName, supplierName, recordingAccountId, recordingAccountName, recordedAt, consentVersion, documentHash]
      properties:
        typedName: { type: string }
        supplierName: { type: string }
        recordingAccountId: { type: integer }
        recordingAccountName: { type: string }
        recordedAt: { type: string, format: date-time }
        consentVersion: { type: string }
        documentHash: { type: string }
    ProcurementInvoice:
      type: object
      required: [id, reference, requestId, itemName, quantity, supplierName, buyerName, unitPrice, shippingFee, totalAmount, currency, issuedAt, signature, signatureType]
      properties:
        id: { type: integer }
        reference: { type: string }
        requestId: { type: integer }
        itemName: { type: string }
        quantity: { type: integer }
        supplierName: { type: string }
        buyerName: { type: string }
        unitPrice: { type: number }
        shippingFee: { type: number }
        totalAmount: { type: number }
        currency: { type: string }
        issuedAt: { type: string, format: date-time }
        signature: { type: string }
        signatureType: { type: string }
        electronicSignature:
          $ref: "#/components/schemas/InvoiceElectronicSignature"
        supplierSignature:
          $ref: "#/components/schemas/InvoiceSupplierSignature"
    ProcurementRequestSummary:
      type: object
      required: [id, itemName, quantity, budgetAmount, currency, requiredDeliveryDate, deliveryLocation, requesterName, status, offerCount, createdAt]
      properties:
        id: { type: integer }
        itemName: { type: string }
        quantity: { type: integer }
        budgetAmount: { type: number }
        currency: { type: string }
        requiredDeliveryDate: { type: string, format: date }
        deliveryLocation: { type: string }
        requesterName: { type: string }
        status:
          type: string
          enum: [open_for_quotes, pending_approval, approved, rejected]
        offerCount: { type: integer }
        selectedSupplier:
          type: [string, "null"]
        createdAt: { type: string, format: date-time }
    ProcurementRequestDetail:
      allOf:
        - $ref: "#/components/schemas/ProcurementRequestSummary"
        - type: object
          required: [offers, selectedOfferId, managerName, managerComment, invoice]
          properties:
            offers:
              type: array
              items:
                $ref: "#/components/schemas/ProcurementOffer"
            selectedOfferId:
              type: [integer, "null"]
            managerName:
              type: [string, "null"]
            managerComment:
              type: [string, "null"]
            invoice:
              oneOf:
                - $ref: "#/components/schemas/ProcurementInvoice"
                - type: "null"
    ProcurementDecisionInput:
      type: object
      required: [decision, managerName]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        offerId:
          type: [integer, "null"]
        managerName:
          type: string
          minLength: 2
        comment:
          type: string
    ProcurementActivity:
      type: object
      required: [id, title, detail, time, kind]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        time: { type: string, format: date-time }
        kind: { type: string }
    ProcurementDashboard:
      type: object
      required: [activeRequests, awaitingApproval, approvedThisMonth, savingsAgainstBudget, recentActivity]
      properties:
        activeRequests: { type: integer }
        awaitingApproval: { type: integer }
        approvedThisMonth: { type: integer }
        savingsAgainstBudget: { type: number }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementActivity"
    ProcurementRecommendation:
      type: object
      required: [supplierName, approvals, reason]
      properties:
        supplierName: { type: string }
        approvals: { type: integer }
        reason: { type: string }
    ProcurementRecommendations:
      type: object
      required: [summary, recommendations, generatedAt, historyCount]
      properties:
        summary: { type: string }
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/ProcurementRecommendation"
        generatedAt: { type: string, format: date-time }
        historyCount: { type: integer }

